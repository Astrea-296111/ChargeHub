global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: chargehub
    metrics_path: /metrics/api
    static_configs:
      - targets: [scrape-proxy:9101]
        labels: {component: api}
  - job_name: chargehub-worker-1
    metrics_path: /metrics/worker-1
    static_configs:
      - targets: [scrape-proxy:9101]
        labels: {component: worker, replica: "1"}
  - job_name: chargehub-worker-2
    metrics_path: /metrics/worker-2
    static_configs:
      - targets: [scrape-proxy:9101]
        labels: {component: worker, replica: "2"}
