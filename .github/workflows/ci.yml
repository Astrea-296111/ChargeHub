name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, unit and domain tests
        run: ./scripts/mvn.sh -B -ntp verify
      - name: Independent simulator tests
        run: python3 -m unittest discover -s simulators -p 'test_*.py' -v
      - name: Start complete dev topology
        run: make up
      - name: Real MySQL concurrency and transaction gates
        run: make integration-test
      - name: End-to-end monetary scenario and API checks
        run: make demo acceptance faults test-invariants
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chargehub-evidence
          path: |
            **/target/surefire-reports/*.xml
            .local/reports/
