x-design-source: spec/04-openapi.yaml
x-runtime-differences:
- 取消与停止受理返回最新 Order，含资源、会话、费率版本及阶段时间。
- 领券、创建费率、创建券模板和死信重放返回 HTTP 200；创建订单返回 201；支付、取消、停止、对账导入和退款重试返回 202。
- 设备收件返回 accepted；支付通知返回资金事实处理结果或 accepted，valid=false 表示已持久化的资金差异。
- 对账本地独有记录为 PENDING_CONFIRMATION，批次为 INCOMPLETE，不能据此删除本地资金事实。
- 登录令牌为不透明随机令牌，并非 JWT；新增 GET /v1/auth/me。
- 站点、券模板与对账差异按 ID 递增；我的券及订单按 ID 递减；各列表返回 nextCursor。
