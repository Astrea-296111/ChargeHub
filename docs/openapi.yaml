components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    CallbackHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256签名；同时必须携带X-Key-Id X-Timestamp X-Nonce，算法见11-integration-contracts.md
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: ^[A-Za-z0-9._:-]{8,64}$
      description: 同一用户和路由内唯一，重试沿用；同Key不同body为409
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 上一页返回的数据库 ID 字符串游标；站点、券模板及差异按 ID 递增，我的券及订单按 ID 递减。
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        data:
          type: object
          nullable: true
      required:
      - code
      - message
      - requestId
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - username
      - password
    Token:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 0
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - roles
    Connector:
      type: object
      additionalProperties: false
      properties:
        connectorId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 数据库64位编号以字符串输出
        deviceId:
          type: string
        connectorCode:
          type: string
        status:
          type: string
        available:
          type: boolean
      required:
      - connectorId
      - deviceId
      - connectorCode
      - status
      - available
    Station:
      type: object
      additionalProperties: false
      properties:
        stationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 数据库64位编号以字符串输出
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
        tariffVersion:
          type: integer
          format: int64
          minimum: 0
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/Connector'
      required:
      - stationId
      - name
      - address
      - timezone
      - tariffVersion
      - connectors
    StationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Station'
