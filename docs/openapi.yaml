        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                businessDate:
                  type: string
                  format: date
                billType:
                  type: string
                  enum:
                  - PAYMENT
                  - REFUND
                channel:
                  type: string
                  enum:
                  - MOCK
                versionNo:
                  type: integer
                  format: int64
                  minimum: 1
                sourceTimezone:
                  type: string
                  enum:
                  - Asia/Shanghai
                  - UTC
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
                  default: 财务导入渠道账单
              required:
              - file
              - businessDate
              - billType
              - channel
              - versionNo
              - sourceTimezone
