openapi: 3.0.3
info:
  title: ChargeHub v1 运行接口
  version: 1.0.0
  description: 运行接口以当前Controller、DTO和返回字段为准，设计基线保留在docs/spec。金额整数分、电量Wh、UTC时间、数据库64位ID以字符串输出。JSON写请求拒绝未知DTO字段、重复字段、尾随内容及分数整数；登录4KiB、身份管理16KiB、其余JSON与集成回调64KiB。财务CSV文件10MiB/总请求11MiB。除登录、报价、签名回调外，业务写操作要求Idempotency-Key。角色与订单所有权在服务端核对；审计接口不暴露密码、令牌或密钥。
servers:
- url: http://127.0.0.1:8080
  description: Compose 开发 API；模拟环境
security:
- BearerAuth: []
tags:
- name: Auth
- name: Station
- name: Order
- name: Benefit
- name: Integration
- name: Admin
- name: IdentityAdmin
- name: CatalogAdmin
- name: BenefitAdmin
- name: Finance
- name: Metering
- name: Operations
- name: Outbox
paths:
  /v1/auth/token:
    post:
      operationId: login
      summary: 演示账号登录
      description: 统一用户名/密码失败响应；未知用户仍执行dummy BCrypt。共享数据库限流默认账号10次/源地址60次每60秒，失败事务不重置预算；token1800秒到期，可撤销。
      tags:
      - Auth
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /v1/stations:
    get:
      operationId: listStations
      summary: 查询站点和枪
      description: 站点按数据库 ID 递增；cursor 沿用上一页 nextCursor。
      tags:
      - Station
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /v1/charge-quotes:
    post:
      operationId: estimateCharge
      summary: 估算费用不占用资源
      description: 预计电量不是实际电量。返回的费率版本用于建单时重新校验。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
  /v1/charge-orders:
    post:
      operationId: createChargeOrder
      summary: 创建充电订单并预占权益
      description: 用户身份从令牌取得。服务端固定预付10000分，校验单用户和单枪占用。
      tags:
      - Order
      responses:
        '201':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
    get:
      operationId: listMyOrders
      summary: 查询自己的订单
      description: 仅本人订单；按created_at DESC,id DESC复合排序。nextCursor为base64url(createdAt|id)不透明游标，客户端应原样回传；兼容本人历史订单ID游标。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: 上一页返回的不透明复合游标，不应解析或构造。
      - $ref: '#/components/parameters/Limit'
  /v1/charge-orders/{orderNo}:
    get:
      operationId: getMyOrder
      summary: 查询订单状态
      description: 仅允许订单所属用户；其他用户包括管理角色返回一致的 404。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/charge-orders/{orderNo}/payment:
    post:
      operationId: createPayment
      summary: 创建或返回原预付支付单
      description: 金额不接受客户端输入。渠道创建和付款确认异步执行。
      tags:
      - Order
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/charge-orders/{orderNo}/cancel:
    post:
      operationId: cancelOrder
      summary: 请求取消并确认渠道事实
      description: WAIT_PAY允许取消。START_PENDING或结果未知不能直接释放；无会话且符合条件才取消。 受理结果为订单当前完整状态，不承诺设备已完成该动作。
      tags:
      - Order
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/charge-orders/{orderNo}/stop:
    post:
      operationId: stopCharge
      summary: 请求停止充电
      description: ' 受理结果为订单当前完整状态，不承诺设备已完成该动作。'
      tags:
      - Order
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/charge-orders/{orderNo}/bill:
    get:
      operationId: getBill
      summary: 查看正式账单
      description: 计量尚未通过完整性验证时返回 409 BILL_NOT_READY，不生成展示用假账单。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/charge-orders/{orderNo}/funds:
    get:
      operationId: getFunds
      summary: 查询支付退款与财务状态
      description: ''
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/me/benefits:
    get:
      operationId: getMyBenefits
      summary: 查询会员月度额度
      description: ''
      tags:
      - Benefit
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitsResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/coupon-templates:
    get:
      operationId: listClaimableCoupons
      summary: 查询可领取模板
      description: 可领取券模板按数据库 ID 递增；cursor 沿用上一页 nextCursor。
      tags:
      - Benefit
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplatePageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /v1/coupon-templates/{templateId}/claims:
    post:
      operationId: claimCoupon
      summary: 领取一张用户券
      description: ''
      tags:
      - Benefit
      responses:
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCouponResponse'
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 数据库64位编号以字符串输出
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/me/coupons:
    get:
      operationId: listMyCoupons
      summary: 查询自己的券
      description: 我的券按数据库 ID 递减；cursor 沿用上一页 nextCursor。
      tags:
      - Benefit
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /integrations/devices/events:
    post:
      operationId: receiveDeviceEvent
      summary: 设备事件收件
      description: 以 device 密钥验签并校验设备、枪和会话归属，原始事件持久化后处理；成功返回 accepted=true。重复事件不重复计量，冲突保留证据并进入 REVIEW。完整条件字段见 spec/05-events.schema.json。
        原始UTF-8 JSON正文上限64KiB，包含未知长度请求；拒绝重复JSON字段。keyId可以是该owner下显式注册的轮换ID。 应用验签层支持显式keyId映射；当前独立模拟器仍为默认ID/单key，未实现或验证双端在线重叠轮换。
      tags:
      - Integration
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAcceptedResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-Key-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        description: 已配置且归属本集成owner的keyId；默认payment或device，允许显式重叠轮换。
      - name: X-Timestamp
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Unix 秒；允许与真实系统时间相差不超过 300 秒，与开发业务固定时钟分开。
      - name: X-Nonce
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEvent'
      security:
      - CallbackHmac: []
  /integrations/payments/mock/notifications:
    post:
      operationId: receiveMockPayment
      summary: 模拟渠道支付退款通知
      description: 以 payment 密钥验签。付款及退款结果包含 valid；false 表示资金事实不匹配、差异已持久化，不能当作支付成功。firstCapture/firstRefund 标识首次生效。PAYMENT_CLOSED 可返回
        accepted=true。同一事件号不同内容为 409；重试沿用原业务号并使用新签名 nonce。 原始UTF-8 JSON正文上限64KiB，包含未知长度请求；拒绝重复JSON字段。keyId可以是该owner下显式注册的轮换ID。 应用验签层支持显式keyId映射；当前独立模拟器仍为默认ID/单key，未实现或验证双端在线重叠轮换。
      tags:
      - Integration
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResultResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-Key-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        description: 已配置且归属本集成owner的keyId；默认payment或device，允许显式重叠轮换。
      - name: X-Timestamp
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Unix 秒；允许与真实系统时间相差不超过 300 秒，与开发业务固定时钟分开。
      - name: X-Nonce
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotification'
      security:
      - CallbackHmac: []
  /v1/admin/tariffs:
    post:
      operationId: createTariff
      summary: OPS创建费率草稿
      description: OPS或ADMIN。跨行完整覆盖与不重叠必须在应用校验。
      tags:
      - Admin
      responses:
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Operation-Reason
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: 可选审计原因，未传时使用服务端明确的创建原因
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTariffRequest'
      x-required-roles:
      - OPS
      - ADMIN
  /v1/admin/tariffs/{tariffId}/publish:
    post:
      operationId: publishTariff
      summary: OPS发布新费率
      description: OPS或ADMIN。发布后不可原地修改，原订单继续使用旧快照。
      tags:
      - Admin
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tariffId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 数据库64位编号以字符串输出
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Operation-Reason
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: 可选审计原因，未传时使用服务端明确的发布原因
      x-required-roles:
      - OPS
      - ADMIN
  /v1/admin/coupon-templates:
    post:
      operationId: createCouponTemplate
      summary: OPS创建券模板草稿
      description: ''
      tags:
      - Admin
      responses:
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCouponTemplateResponse'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Operation-Reason
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: 可选审计原因，未传时使用服务端明确的创建原因
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponTemplateRequest'
      x-required-roles:
      - OPS
      - ADMIN
    get:
      operationId: listAdminCouponTemplates
      summary: 分页读取活动草稿与已发布模板
      tags:
      - BenefitAdmin
      responses:
        '200':
          description: 成功；状态以data为准
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCouponTemplatePageResponse'
        default:
          description: 明确业务拒绝或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 64位数据库编号使用十进制字符串
        description: 上一页nextCursor；此资源按数据库ID升序
      - $ref: '#/components/parameters/Limit'
      x-required-roles:
      - OPS
      - ADMIN
      description: 服务端要求OPS 或 ADMIN。
  /v1/admin/coupon-templates/{templateId}/publish:
    post:
      operationId: publishCouponTemplate
      summary: OPS发布券模板
      description: ''
      tags:
      - Admin
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCouponTemplateResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 数据库64位编号以字符串输出
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Operation-Reason
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: 可选审计原因，未传时使用服务端明确的发布原因
      x-required-roles:
      - OPS
      - ADMIN
  /v1/admin/reconciliations:
    post:
      operationId: importReconciliation
      summary: FINANCE导入渠道账单
      description: FINANCE 或 ADMIN。UTF-8 CSV 最大 10MiB，字段、业务日期和时区严格验证；同批次相同哈希返回原结果，不同文件返回 409 RECONCILIATION_CONFLICT。仅保存双向差异及审计，不根据
        CSV 直接入账。LOCAL_ONLY 为待完整性确认，批次为 INCOMPLETE。 总multipart请求上限11MiB。reason可选，默认财务导入渠道账单。后续恢复由独立财务接口执行，保留查询与完整性证据。
