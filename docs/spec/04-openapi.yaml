openapi: 3.0.3
info:
  title: ChargeHub 后端核心契约
  version: 1.0.0
  description: 设计基线，尚未连接运行中的后端。金额单位分，电量Wh，时间RFC3339 UTC，数据库64位ID用字符串。首版固定预付10000分。POST业务写要求Idempotency-Key，登录、报价及回调除外。设备事件的条件必填详见05-events.schema.json。管理接口必须执行描述中的角色检查。
servers:
- url: http://localhost:8080
  description: 计划中的本地API地址
security:
- BearerAuth: []
tags:
- name: Auth
- name: Station
- name: Order
- name: Benefit
- name: Integration
- name: Admin
paths:
  /v1/auth/token:
    post:
      operationId: login
      summary: 演示账号登录
      description: ''
      tags:
      - Auth
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /v1/stations:
    get:
      operationId: listStations
      summary: 查询站点和枪
      description: ''
      tags:
      - Station
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id001
        $ref: '#/components/parameters/Cursor'
      - &id002
        $ref: '#/components/parameters/Limit'
  /v1/charge-quotes:
    post:
      operationId: estimateCharge
      summary: 估算费用不占用资源
      description: 预计电量不是实际电量。返回的费率版本用于建单时重新校验。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
  /v1/charge-orders:
    post:
      operationId: createChargeOrder
      summary: 创建充电订单并预占权益
      description: 用户身份从令牌取得。服务端固定预付10000分，校验单用户和单枪占用。
      tags:
      - Order
      responses:
        '201':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
    get:
      operationId: listMyOrders
      summary: 查询自己的订单
      description: ''
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
  /v1/charge-orders/{orderNo}:
    get:
      operationId: getMyOrder
      summary: 查询订单状态
      description: 必须校验订单归属，管理员查询同样记录授权行为。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema: &id003
          type: string
          format: uuid
  /v1/charge-orders/{orderNo}/payment:
    post:
      operationId: createPayment
      summary: 创建或返回原预付支付单
      description: 金额不接受客户端输入。渠道创建和付款确认异步执行。
      tags:
      - Order
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/charge-orders/{orderNo}/cancel:
    post:
      operationId: cancelOrder
      summary: 请求取消并确认渠道事实
      description: WAIT_PAY允许取消。START_PENDING或结果未知不能直接释放；无会话且符合条件才取消。
      tags:
      - Order
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/charge-orders/{orderNo}/stop:
    post:
      operationId: stopCharge
      summary: 请求停止充电
      description: ''
      tags:
      - Order
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/charge-orders/{orderNo}/bill:
    get:
      operationId: getBill
      summary: 查看正式账单
      description: 未出账返回409和BILLING_DATA_INCOMPLETE。不得生成展示用假账单。
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema: *id003
  /v1/charge-orders/{orderNo}/funds:
    get:
      operationId: getFunds
      summary: 查询支付退款与财务状态
      description: ''
      tags:
      - Order
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema: *id003
  /v1/me/benefits:
    get:
      operationId: getMyBenefits
      summary: 查询会员月度额度
      description: ''
      tags:
      - Benefit
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitsResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/coupon-templates:
    get:
      operationId: listClaimableCoupons
      summary: 查询可领取模板
      description: ''
      tags:
      - Benefit
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplatePageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
  /v1/coupon-templates/{templateId}/claims:
    post:
      operationId: claimCoupon
      summary: 领取一张用户券
      description: ''
      tags:
      - Benefit
      responses:
        '201':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCouponResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: templateId
        in: path
        required: true
        schema: &id007
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 数据库64位编号以字符串输出
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/me/coupons:
    get:
      operationId: listMyCoupons
      summary: 查询自己的券
      description: ''
      tags:
      - Benefit
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
  /integrations/devices/events:
    post:
      operationId: receiveDeviceEvent
      summary: 设备事件收件
      description: 验签并校验设备归属。持久化收件后确认，异步归并计量；完整条件字段见JSON Schema。
      tags:
      - Integration
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id004
        name: X-Key-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - &id005
        name: X-Timestamp
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - &id006
        name: X-Nonce
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEvent'
      security:
      - CallbackHmac: []
  /integrations/payments/mock/notifications:
    post:
      operationId: receiveMockPayment
      summary: 模拟渠道支付退款通知
      description: 有效事件在资金事实和Outbox提交后返回APPLIED；已持久化差异返回QUARANTINED。失败时渠道按原事件号重试并重新签名。
      tags:
      - Integration
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      - *id005
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotification'
      security:
      - CallbackHmac: []
  /v1/admin/tariffs:
    post:
      operationId: createTariff
      summary: OPS创建费率草稿
      description: OPS或ADMIN。跨行完整覆盖与不重叠必须在应用校验。
      tags:
      - Admin
      responses:
        '201':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTariffRequest'
  /v1/admin/tariffs/{tariffId}/publish:
    post:
      operationId: publishTariff
      summary: OPS发布新费率
      description: OPS或ADMIN。发布后不可原地修改，原订单继续使用旧快照。
      tags:
      - Admin
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tariffId
        in: path
        required: true
        schema: *id007
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/admin/coupon-templates:
    post:
      operationId: createCouponTemplate
      summary: OPS创建券模板草稿
      description: ''
      tags:
      - Admin
      responses:
        '201':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCouponTemplateResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponTemplateRequest'
  /v1/admin/coupon-templates/{templateId}/publish:
    post:
      operationId: publishCouponTemplate
      summary: OPS发布券模板
      description: ''
      tags:
      - Admin
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCouponTemplateResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: templateId
        in: path
        required: true
        schema: *id007
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/admin/reconciliations:
    post:
      operationId: importReconciliation
      summary: FINANCE导入渠道账单
      description: FINANCE或ADMIN。CSV格式见11-integration-contracts.md，最大10MiB。验证渠道与业务日期，重复相同批次及哈希返回原结果。
      tags:
      - Admin
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationBatchResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                businessDate:
                  type: string
                  format: date
                billType:
                  type: string
                  enum:
                  - PAYMENT
                  - REFUND
                channel:
                  type: string
                  enum:
                  - MOCK
                versionNo:
                  type: integer
                  format: int64
                  minimum: 1
                sourceTimezone:
                  type: string
                  enum:
                  - Asia/Shanghai
                  - UTC
              required:
              - file
              - businessDate
              - billType
              - channel
              - versionNo
              - sourceTimezone
  /v1/admin/reconciliation-items:
    get:
      operationId: listReconciliationItems
      summary: FINANCE查询差异
      description: ''
      tags:
      - Admin
      responses:
        '200':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationPageResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
      - name: status
        in: query
        schema:
          type: string
  /v1/admin/refunds/{refundNo}/retry:
    post:
      operationId: retryRefund
      summary: FINANCE查单与受控重试
      description: 只对可恢复单查单后按原退款号重试。SUCCESS安全返回已有结果；FAILED_FINAL返回409，不另造退款号。
      tags:
      - Admin
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAcceptedResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: refundNo
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
  /v1/admin/outbox/{eventId}/replay:
    post:
      operationId: replayOutbox
      summary: ADMIN重放死信事件
      description: 仅允许DEAD事件，原事件号和载荷不变，必须保存操作审计。
      tags:
      - Admin
      responses:
        '202':
          description: 成功或已受理，按data中的状态继续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAcceptedResponse'
        default:
          description: 明确业务错误或技术错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: eventId
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CallbackHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256签名；同时必须携带X-Key-Id X-Timestamp X-Nonce，算法见11-integration-contracts.md
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
      description: 同一用户和路由内唯一，重试沿用；同Key不同body为409
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 不透明游标
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId: *id003
        data:
          type: object
          nullable: true
      required:
      - code
      - message
      - requestId
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - username
      - password
    Token:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 0
        roles:
          type: array
          items:
            type: string
      required:
      - accessToken
      - tokenType
      - expiresIn
      - roles
    Connector:
      type: object
      additionalProperties: false
      properties:
        connectorId: *id007
        deviceId:
          type: string
        connectorCode:
          type: string
        status:
          type: string
        available:
