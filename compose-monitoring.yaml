# docker compose --env-file .local/dev.env \
#   -f compose.yaml -f compose-monitoring.yaml up -d --build
services:
  api:
    environment: &metrics-env
      CHARGEHUB_MONITOR_PASSWORD: ${CHARGEHUB_MONITOR_PASSWORD:?run python3 scripts/monitoring/setup.py}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HIKARICP_CONNECTIONS_ACQUIRE: "true"
  worker:
    environment: *metrics-env
    deploy: {replicas: 2}
  scrape-proxy:
    build: ./scripts/monitoring
    image: chargehub-scrape-proxy:1.0.0
    environment:
      MONITOR_API_URL: http://api:8080
      MONITOR_WORKER_1_URL: http://${COMPOSE_PROJECT_NAME:-chargehub}-worker-1:8080
      MONITOR_WORKER_2_URL: http://${COMPOSE_PROJECT_NAME:-chargehub}-worker-2:8080
      MONITOR_USERNAME: __monitor__
      MONITOR_PASSWORD_FILE: /run/secrets/monitor_password
    secrets: [monitor_password]
    read_only: true
    tmpfs: [/tmp:size=8m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.2
    mem_limit: 64m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    depends_on: [scrape-proxy]
  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets: [grafana_admin_password]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.3
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [prometheus]
volumes:
  prometheus-data:
  grafana-data:
secrets:
  monitor_password:
    file: ./.local/monitoring/monitor-password
  grafana_admin_password:
    file: ./.local/monitoring/grafana-admin-password
