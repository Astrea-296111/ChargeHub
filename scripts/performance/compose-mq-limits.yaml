# Applied after the shared MQ overlay, in the isolated performance project only.
services:
  mq-namesrv:
    cpus: 0.1
    mem_limit: 256m
  mq-broker:
    cpus: 1.0
    mem_limit: 1536m
  mq-init:
    cpus: 0.2
    mem_limit: 512m
  worker:
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker,mq,perf
